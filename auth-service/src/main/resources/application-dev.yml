# Opt-in local diagnostics. Do not activate in shared environments.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.amit.ems: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"