server:
  port: 8081

spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ems_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    com.amit.ems: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

notification:
#  service-url: http://localhost:8083/api/v1/notifications/employee-created
  service-url: http://${NOTIFICATION_HOST:localhost}:8083/api/v1/notifications/employee-created