name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress -Pmysql-integration-tests clean verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spotbugs-reports
          path: |
            **/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan SBOM for vulnerabilities
        run: |
          mkdir -p "${HOME}/.cache/trivy"

          docker run --rm \
            -v "${PWD}:/workspace:ro" \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            sbom \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            /workspace/target/bom.json

  kubernetes-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/base |
            docker run --rm -i \
              ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict \
              -summary \
              -kubernetes-version 1.36.0

  docker-build:
    name: Docker Image Build
    needs:
      - maven-verify
      - kubernetes-validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AUTH_SERVICE_IMAGE: ems-auth-service:${{ github.sha }}
      EMPLOYEE_SERVICE_IMAGE: ems-employee-service:${{ github.sha }}
      NOTIFICATION_SERVICE_IMAGE: ems-notification-service:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create disposable CI environment file
        run: |
          umask 077
          {
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'EMS_DB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'EMS_DB_USERNAME=ems_app\n'
            printf 'EMS_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'AUTH_DB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'AUTH_DB_USERNAME=auth_app\n'
            printf 'AUTH_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > .env

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Build application images
        run: |
          docker compose build \
            --pull \
            auth-service \
            employee-service \
            notification-service

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.AUTH_SERVICE_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Scan employee-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.EMPLOYEE_SERVICE_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Scan notification-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.NOTIFICATION_SERVICE_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Start disposable Compose stack
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Run Compose smoke check
        run: python3 scripts/compose-smoke.py

      - name: Show Compose status on failure
        if: failure()
        run: docker compose ps

      - name: Stop Compose stack
        if: always()
        run: docker compose down
