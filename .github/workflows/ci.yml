name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spotbugs-reports
          path: |
            **/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 7

  kubernetes-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/base |
            docker run --rm -i \
              ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict \
              -summary \
              -kubernetes-version 1.36.0

  docker-build:
    name: Docker Image Build
    needs:
      - maven-verify
      - kubernetes-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Build application images
        run: |
          docker compose build \
            auth-service \
            employee-service \
            notification-service
