apiVersion: v1
kind: Service
metadata:
  name: mysql-ems-headless
  namespace: ems
  labels:
    app.kubernetes.io/name: mysql-ems
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: employee-management-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql-ems
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-ems
  namespace: ems
  labels:
    app.kubernetes.io/name: mysql-ems
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: employee-management-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql-ems
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-ems
  namespace: ems
  labels:
    app.kubernetes.io/name: mysql-ems
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: employee-management-system
spec:
  serviceName: mysql-ems-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-ems
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-ems
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: employee-management-system
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 448Mi
            limits:
              cpu: "1"
              memory: 640Mi
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: ems_db
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ems-db-credentials
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-db-credentials
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-db-credentials
                  key: root-password
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mysqladmin ping
                  -h 127.0.0.1
                  -u root
                  --password="$MYSQL_ROOT_PASSWORD"
                  --silent
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mysqladmin ping
                  -h 127.0.0.1
                  -u root
                  --password="$MYSQL_ROOT_PASSWORD"
                  --silent
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mysqladmin ping
                  -h 127.0.0.1
                  -u root
                  --password="$MYSQL_ROOT_PASSWORD"
                  --silent
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: ems-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: ems-data
        labels:
          app.kubernetes.io/name: mysql-ems
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: employee-management-system
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi