services:
  mysql-ems:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ems_db
      MYSQL_USER: ${EMS_DB_USERNAME:?EMS_DB_USERNAME must be set}
      MYSQL_PASSWORD: ${EMS_DB_PASSWORD:?EMS_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${EMS_DB_ROOT_PASSWORD:?EMS_DB_ROOT_PASSWORD must be set}
    ports:
      - "3307:3306"
    volumes:
      - ems-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME must be set}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?AUTH_DB_ROOT_PASSWORD must be set}
    ports:
      - "3308:3306"
    volumes:
      - auth-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-employee-management-system-auth-service:latest}
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql-auth
      DB_USERNAME: ${AUTH_DB_USERNAME:?AUTH_DB_USERNAME must be set}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8082/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  employee-service:
    image: ${EMPLOYEE_SERVICE_IMAGE:-employee-management-system-employee-service:latest}
    build:
      context: .
      dockerfile: employee-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql-ems
      DB_USERNAME: ${EMS_DB_USERNAME:?EMS_DB_USERNAME must be set}
      DB_PASSWORD: ${EMS_DB_PASSWORD:?EMS_DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      NOTIFICATION_HOST: notification-service
    depends_on:
      mysql-ems:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8081/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE:-employee-management-system-notification-service:latest}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8083/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  ems-data:
  auth-data: